services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myplanner
      POSTGRES_PASSWORD: ${PASS_DB}
      POSTGRES_DB: myplanner
    network_mode: host
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myplanner -d myplanner"]
      interval: 5s
      timeout: 3s
      retries: 5

  evolution:
    image: atendai/evolution-api:latest
    network_mode: host
    environment:
      - SERVER_PORT=8085
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-myplanner-evo-key}
    volumes:
      - evolution_data:/evolution/instances
    restart: unless-stopped

volumes:
  pgdata:
  evolution_data:
